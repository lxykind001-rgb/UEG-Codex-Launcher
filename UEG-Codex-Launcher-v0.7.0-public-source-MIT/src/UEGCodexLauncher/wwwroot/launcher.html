<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self'; frame-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; connect-src 'self';" />
  <title>UEG · Codex Launcher</title>
  <style>
    :root{color-scheme:dark;font-family:Consolas,'Segoe UI',sans-serif}
    html,body{margin:0;width:100%;height:100%;background:#05060a;color:#d7e1ed;overflow:hidden}
    #splash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
    #splash b{font-size:22px;letter-spacing:.26em;font-weight:500}
    #status{font-size:12px;letter-spacing:.14em;color:#8b99aa}
    #ueg-frame{width:100%;height:100%;display:block;visibility:hidden;border:0;background:#05060a}
    #ueg-frame.active{visibility:visible}
    #handoff-actions{display:none;gap:12px;margin-top:12px}
    #handoff-actions button{padding:8px 16px;background:#151b25;color:#d7e1ed;
      border:1px solid #526071;font-family:inherit;letter-spacing:.1em;cursor:pointer}
    #handoff-actions button:focus-visible{outline:2px solid #c2d9ef;outline-offset:3px}
    #status{max-width:min(86vw,860px);text-align:center;line-height:1.8;letter-spacing:.08em}
    .note{position:absolute;bottom:28px;color:#606e7b;font-size:11px;letter-spacing:.12em}
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite"><b>UEG / ACCESS</b><span id="status">Loading startup settings…</span><div id="handoff-actions"><button id="retry-handoff" type="button">重试查找 Codex</button><button id="close-launcher" type="button">关闭启动器</button></div><span class="note">LOCAL VISUAL BOOT · NO REAL AUTHENTICATION</span></div>
  <iframe id="ueg-frame" title="UEG 接触式启动终端" allow="autoplay"></iframe>
  <script src="bridge.js"></script>
  <script src="launcher-init.js"></script>
</body>
</html>
